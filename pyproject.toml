[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fixpilot"
version = "0.1.0"
description = "FixPilot AI: Autonomous Software Debugging & Self-Healing Agent"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "google-generativeai>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "pytest-cov>=4.0",
    "streamlit>=1.49",
    "plotly",
    "pandas",
]

[project.urls]
Homepage = "https://github.com/example/fixpilot-ai"

[project.scripts]
fixpilot = "fixpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning:google.*",
]
